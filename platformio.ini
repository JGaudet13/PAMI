; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
default_envs = pami1

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 115200
upload_protocol = esptool

; 1. Fix the Flash size error
board_upload.flash_size = 4MB
board_build.arduino.partitions = default.csv

; 2. Enable the Native USB CDC (Vital for Serial to work)
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; 3. Force the correct Flash mode for WROOM-1
board_build.flash_mode = dio
lib_deps =
    madhephaestus/ESP32Servo @ ^1.2.1
    pololu/QTRSensors @ ^4.0.0

[env:pami1]
build_flags =
    ${env.build_flags}
    -DPAMI_ID=1

[env:pami2]
build_flags =
    ${env.build_flags}
    -DPAMI_ID=2

[env:pami3]
build_flags =
    ${env.build_flags}
    -DPAMI_ID=3

[env:pami4]
build_flags =
    ${env.build_flags}
    -DPAMI_ID=4

[env:pami5]
build_flags =
    ${env.build_flags}
    -DPAMI_ID=5
